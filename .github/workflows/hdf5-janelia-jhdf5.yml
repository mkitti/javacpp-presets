# Builds the hdf5 presets from this branch (bytedeco/javacpp-presets#1814) for windows-x86_64 and
# linux-x86_64, then runs the downstream test suites against that build:
# JaneliaSciComp/janelia-jhdf5 on Java 21 and Java 8, and saalfeldlab/n5-hdf5 (its PR #50).
name: hdf5-janelia-jhdf5
on:
  push:
    branches:
      - ci-janelia-jhdf5-windows
  workflow_dispatch:
    inputs:
      janelia-jhdf5-ref:
        description: janelia-jhdf5 branch to test
        default: load-library-init-order
      n5-hdf5-ref:
        description: n5-hdf5 ref to test (empty to skip)
        default: refs/pull/50/head
env:
  CI_DEPLOY_MODULE: hdf5
  JANELIA_REF: ${{ inputs.janelia-jhdf5-ref || 'load-library-init-order' }}
  N5_REF: ${{ inputs.n5-hdf5-ref || 'refs/pull/50/head' }}
jobs:
  windows-x86_64:
    runs-on: windows-2022
    env:
      CI_DEPLOY_PLATFORM: windows-x86_64
      # The action's last step deletes all SNAPSHOT artifacts from the default local
      # repository, so install the hdf5 build somewhere that step doesn't touch.
      JHDF5_M2: C:\jhdf5-m2
      CI_DEPLOY_OPTIONS: -Dmaven.repo.local=C:\jhdf5-m2
    steps:
      - name: Build hdf5 presets
        uses: bytedeco/javacpp-presets/.github/actions/deploy-windows@actions
      - name: Show the natives that were installed
        shell: bash
        run: |
          jar=/c/jhdf5-m2/org/bytedeco/hdf5/2.2.0-1.5.15-SNAPSHOT/hdf5-2.2.0-1.5.15-SNAPSHOT-windows-x86_64.jar
          ls -l "$jar"
          unzip -l "$jar" | grep -E '\.dll$'
          # Only builds with the fix bundle the C++ library; fail early if this is the old one.
          unzip -l "$jar" | grep -q 'hdf5_cpp\.dll'
      - name: Check out janelia-jhdf5
        uses: actions/checkout@v4
        with:
          repository: JaneliaSciComp/janelia-jhdf5
          ref: ${{ env.JANELIA_REF }}
          path: janelia-jhdf5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Test janelia-jhdf5 (Java 21)
        working-directory: janelia-jhdf5
        shell: bash
        # No -U: resolve org.bytedeco:hdf5 from the build installed above, not the published snapshot.
        # -Djavacpp.platform limits hdf5-platform to the natives built above.
        run: mvn -B test "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=windows-x86_64
      - name: Upload janelia-jhdf5 test reports (Java 21)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janelia-jhdf5-test-reports-windows-java21
          path: |
            janelia-jhdf5/target/surefire-reports/
            janelia-jhdf5/hs_err_pid*.log
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - name: Test janelia-jhdf5 (Java 8)
        working-directory: janelia-jhdf5
        shell: bash
        run: mvn -B clean test "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=windows-x86_64
      - name: Upload janelia-jhdf5 test reports (Java 8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janelia-jhdf5-test-reports-windows-java8
          path: |
            janelia-jhdf5/target/surefire-reports/
            janelia-jhdf5/hs_err_pid*.log
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        if: env.N5_REF != ''
        with:
          distribution: zulu
          java-version: '21'
      - name: Install janelia-jhdf5 for n5-hdf5
        if: env.N5_REF != ''
        working-directory: janelia-jhdf5
        shell: bash
        run: mvn -B clean install -DskipTests -Djacoco.skip=true "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=windows-x86_64
      - name: Check out n5-hdf5
        if: env.N5_REF != ''
        uses: actions/checkout@v4
        with:
          repository: saalfeldlab/n5-hdf5
          ref: ${{ env.N5_REF }}
          path: n5-hdf5
      - name: Test n5-hdf5
        if: env.N5_REF != ''
        working-directory: n5-hdf5
        shell: bash
        # pom-scijava's enforcer rejects SNAPSHOT dependencies, which is the point of this run.
        run: mvn -B test -Denforcer.skip=true "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=windows-x86_64
      - name: Upload n5-hdf5 test reports
        if: always() && env.N5_REF != ''
        uses: actions/upload-artifact@v4
        with:
          name: n5-hdf5-test-reports-windows
          path: |
            n5-hdf5/target/surefire-reports/
            n5-hdf5/hs_err_pid*.log
          if-no-files-found: ignore

  linux-x86_64:
    runs-on: ubuntu-22.04
    env:
      CI_DEPLOY_PLATFORM: linux-x86_64
      JHDF5_M2: /home/runner/jhdf5-m2
      CI_DEPLOY_OPTIONS: -Dmaven.repo.local=/home/runner/jhdf5-m2
    steps:
      - name: Build hdf5 presets
        uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
      - name: Show the natives that were installed
        shell: bash
        run: |
          jar=$JHDF5_M2/org/bytedeco/hdf5/2.2.0-1.5.15-SNAPSHOT/hdf5-2.2.0-1.5.15-SNAPSHOT-linux-x86_64.jar
          ls -l "$jar"
          unzip -l "$jar" | grep -E '\.so'
      - name: Check out janelia-jhdf5
        uses: actions/checkout@v4
        with:
          repository: JaneliaSciComp/janelia-jhdf5
          ref: ${{ env.JANELIA_REF }}
          path: janelia-jhdf5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Test janelia-jhdf5 (Java 21)
        working-directory: janelia-jhdf5
        shell: bash
        run: mvn -B test "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=linux-x86_64
      - name: Upload janelia-jhdf5 test reports (Java 21)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janelia-jhdf5-test-reports-linux-java21
          path: |
            janelia-jhdf5/target/surefire-reports/
            janelia-jhdf5/hs_err_pid*.log
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - name: Test janelia-jhdf5 (Java 8)
        working-directory: janelia-jhdf5
        shell: bash
        run: mvn -B clean test "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=linux-x86_64
      - name: Upload janelia-jhdf5 test reports (Java 8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janelia-jhdf5-test-reports-linux-java8
          path: |
            janelia-jhdf5/target/surefire-reports/
            janelia-jhdf5/hs_err_pid*.log
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        if: env.N5_REF != ''
        with:
          distribution: zulu
          java-version: '21'
      - name: Install janelia-jhdf5 for n5-hdf5
        if: env.N5_REF != ''
        working-directory: janelia-jhdf5
        shell: bash
        run: mvn -B clean install -DskipTests -Djacoco.skip=true "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=linux-x86_64
      - name: Check out n5-hdf5
        if: env.N5_REF != ''
        uses: actions/checkout@v4
        with:
          repository: saalfeldlab/n5-hdf5
          ref: ${{ env.N5_REF }}
          path: n5-hdf5
      - name: Test n5-hdf5
        if: env.N5_REF != ''
        working-directory: n5-hdf5
        shell: bash
        run: mvn -B test -Denforcer.skip=true "-Dmaven.repo.local=$JHDF5_M2" -Djavacpp.platform=linux-x86_64
      - name: Upload n5-hdf5 test reports
        if: always() && env.N5_REF != ''
        uses: actions/upload-artifact@v4
        with:
          name: n5-hdf5-test-reports-linux
          path: |
            n5-hdf5/target/surefire-reports/
            n5-hdf5/hs_err_pid*.log
          if-no-files-found: ignore
